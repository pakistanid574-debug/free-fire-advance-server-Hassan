<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="mqs9JNllYYrmpEj7YBh1NQzu8LO6x6gPJGXv8rbt-EQ"/>

<title>FF Links</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
display:none;
min-height:100vh;
background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
color:white;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 30px;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
font-size:22px;
font-weight:700;
color:#4da3ff;
cursor:pointer;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:600;
transition:0.3s;
}

nav a:hover{
color:#4da3ff;
}

/* PAGE */

.page{
display:none;
padding:40px;
max-width:750px;
margin:auto;
}

.active{
display:block;
}

/* TITLE */

h1{
margin-bottom:20px;
text-align:center;
}

/* CARD */

.card{
background:rgba(255,255,255,0.08);
border-radius:16px;
padding:22px;
margin-top:20px;
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.1);
transition:0.3s;
text-align:center;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* BUTTON */

button{
margin-top:12px;
padding:14px;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
background:linear-gradient(135deg,#0a84ff,#0066ff);
color:white;
transition:0.3s;
width:100%;
font-size:16px;
}

button:hover{
transform:scale(1.05);
}

button:disabled{
background:grey;
cursor:not-allowed;
opacity:0.6;
}

/* COMING */

.coming{
text-align:center;
font-size:42px;
margin-top:120px;
}

/* BLOCK */

.block{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:black;
font-size:28px;
text-align:center;
}

/* FOOTER */

.footer{
position:fixed;
bottom:10px;
right:15px;
font-size:13px;
opacity:0.7;
}

</style>
</head>

<body>

<nav>

<div class="logo" onclick="showPage('home')">
🔥 FF SITE
</div>

<div>
<a href="#" onclick="showPage('home')">Home</a>
<a href="#" onclick="showPage('contact')">Contact</a>
</div>

</nav>

<!-- HOME -->

<div id="home" class="page active">

<h1>Free Fire</h1>

<div class="card">

<button disabled>
🚀 Advance Server APK (Coming Soon)
</button>

</div>

</div>

<!-- CONTACT -->

<div id="contact" class="page">

<h1>Contact</h1>

<div class="card">
Email: <b id="email">ghostgi362@gmail.com</b>
</div>

</div>

<footer class="footer">
Version 1.2.40
</footer>

<script>

/* COUNTRY CHECK */

fetch("https://ipapi.co/json/")
.then(res=>res.json())
.then(data=>{

let c=data.country_code

if(c==="US"||c==="IL"){
document.body.style.display="block"
document.body.innerHTML=`<div class="block">🚫 Website not available in your country</div>`
}
else{
document.body.style.display="block"
}

})
.catch(()=>{
document.body.style.display="block"
})

/* PAGE SWITCH */

function showPage(page){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active")
})

document.getElementById(page).classList.add("active")

}

</script>

</body>
</html>
