<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="mqs9JNllYYrmpEj7YBh1NQzu8LO6x6gPJGXv8rbt-EQ" />

<title>FF Links</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

/* BODY HIDDEN UNTIL COUNTRY CHECK */

body{
display:none;
background:url("https://dl.dir.freefiremobile.com/common/OB53/CSH/ADV/bg_main.jpg");
background-size:cover;
background-position:center;
color:white;
min-height:100vh;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(0,0,0,0.6);
}

.logo{
font-size:22px;
font-weight:bold;
cursor:pointer;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-weight:bold;
}

/* PAGES */

.page{
display:none;
padding:40px;
}

.active{
display:block;
}

/* CARD */

.card{
background:rgba(0,0,0,0.65);
padding:20px;
border-radius:10px;
margin-top:20px;
max-width:600px;
}

/* BUTTON */

button{
background:#ff9800;
border:none;
padding:10px 20px;
color:white;
border-radius:6px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

button:hover{
background:#e68900;
}

/* LINK */

.link{
background:#111;
padding:10px;
border-radius:6px;
margin-top:10px;
word-break:break-all;
}

/* COMING */

.coming{
text-align:center;
font-size:40px;
margin-top:120px;
}

/* BLOCK */

.block{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:black;
color:white;
font-size:32px;
text-align:center;
}

</style>
</head>

<body>

<nav>

<div class="logo" onclick="showPage('coming')">
🔥 FF SITE
</div>

<div>
<a href="#" onclick="showPage('home')">Home</a>
<a href="#" onclick="showPage('contact')">Contact</a>
</div>

</nav>

<!-- HOME -->

<div id="home" class="page active">

<h1>Free Fire Image Links</h1>

<div class="card">

<div class="link" id="link1">
https://dl.dir.freefiremobile.com/common/OB53/CSH/ADV/bg_main.jpg
</div>

<button onclick="copyLink('link1')">
Copy Link
</button>

</div>

<div class="card">

<div class="link" id="link2">
https://dl.dir.freefiremobile.com/common/OB52/ID/asdmk1nfbasc/splash_daftar.jpg
</div>

<button onclick="copyLink('link2')">
Copy Link
</button>

</div>

</div>

<!-- CONTACT -->

<div id="contact" class="page">

<h1>Contact</h1>

<div class="card">
Email: <b>ghostgi362@gmail.com</b>
</div>

</div>

<!-- COMING -->

<div id="coming" class="page">

<div class="coming">
🚀 Coming Soon
</div>

</div>

<script>

/* COUNTRY CHECK BEFORE SHOWING SITE */

fetch("https://ipapi.co/json/")
.then(res => res.json())
.then(data => {

let country=data.country_code

if(country==="US" || country==="IL"){

document.body.style.display="block"
document.body.innerHTML=`<div class="block">🚫 This website is not available in your country</div>`

}else{

document.body.style.display="block"

}

})

.catch(()=>{

document.body.style.display="block"

})


/* PAGE SWITCH */

function showPage(page){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active")
})

document.getElementById(page).classList.add("active")

}

/* COPY */

function copyLink(id){

let text=document.getElementById(id).innerText
navigator.clipboard.writeText(text)
alert("Link copied!")

}

</script>

</body>
</html>
